name: Deploy PFO OS Dashboard

on:
  pull_request:
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  push:
    branches:
      - main
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pfo-dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    name: Package dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build browser calculator modules
        run: |
          pnpm --filter @pfo/models build
          pnpm --filter @pfo/calculators build
          pnpm --filter @pfo/analytics build
          pnpm --filter @pfo/reports... build
          node scripts/dashboard/prepare-calculators.mjs
      - name: Validate dashboard files
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/dashboard/index.html
          test -s apps/dashboard/styles.css
          test -s apps/dashboard/app.js
          test -s apps/dashboard/workspace-security.js
          test -s apps/dashboard/calculators-runtime/FireReadiness.js
          test -s apps/dashboard/calculators-runtime/FireScenarioComparison.js
          test -s apps/dashboard/calculators-runtime/RequiredFireContribution.js
          test -s apps/dashboard/reports-runtime/FireScenarioReport.js
          test -s apps/dashboard/calculators-runtime/CompoundGrowth.js
          test -s apps/dashboard/analytics-runtime/RiskAnalysis.js
          test -s apps/dashboard/analytics-runtime/DiversificationAnalysis.js
          grep -q 'analyzeDiversification' apps/dashboard/app.js
          test -s apps/dashboard/return-risk.js
          node --check apps/dashboard/app.js
          node --check apps/dashboard/return-risk.js
          node --check apps/dashboard/workspace-security.js
          grep -q 'hosted-privacy-notice' apps/dashboard/index.html
          grep -q 'isPrivateWorkspaceAllowed' apps/dashboard/app.js
          grep -q 'showLocalWorkspaceRequired' apps/dashboard/app.js
          if grep -R -nE 'https?://[^ ]+\.(js|css)(\?|["'\'' ])' apps/dashboard; then
            echo "::error::Dashboard must not load remote JavaScript or CSS."
            exit 1
          fi
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/dashboard

  deploy:
    name: Publish dashboard
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
