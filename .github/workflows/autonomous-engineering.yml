name: PFO Autonomous Engineering

on:
  schedule:
    # GitHub-hosted runner; independent of the Principal's computer.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: pfo-autonomous-engineering
  cancel-in-progress: false

jobs:
  autonomous-engineering:
    name: Implement, validate, and merge one sprint increment
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validate required credentials
        id: auth
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PFO_AUTOMATION_TOKEN: ${{ secrets.PFO_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$PFO_AUTOMATION_TOKEN" ]]; then
            echo "::error::Missing repository secret PFO_AUTOMATION_TOKEN. See docs/engineering/AUTONOMOUS_ENGINEERING.md."
            exit 1
          fi

          if [[ -n "$ANTHROPIC_API_KEY" ]]; then
            echo "method=api" >> "$GITHUB_OUTPUT"
          elif [[ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "method=oauth" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Configure either ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN. See docs/engineering/AUTONOMOUS_ENGINEERING.md."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run autonomous engineering agent
        id: agent
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          github_token: ${{ secrets.PFO_AUTOMATION_TOKEN }}
          anthropic_api_key: ${{ steps.auth.outputs.method == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ steps.auth.outputs.method == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          base_branch: main
          branch_prefix: pfo-agent/
          branch_name_template: "{{prefix}}{{timestamp}}"
          claude_args: |
            --max-turns 12
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(pnpm:*),Bash(git status:*),Bash(git diff:*)"
          prompt: |
            You are the autonomous engineering executor for PFO OS. Work only on the active sprint.

            Before changing anything, read START_HERE.md, pfo.json, .ai/AI_CONTEXT.md,
            .ai/AI_CONTRACT.md, .ai/PROJECT_STATE.md, .ai/CURRENT_SPRINT.md,
            .ai/HANDOFF.md, and the existing decisions/backlog files if present.
            Inspect the current repository implementation and tests. Do not duplicate
            open pull requests or work already merged.

            Complete exactly one small, meaningful, independently reviewable increment.
            Prefer tested code improvements over documentation-only changes. Run relevant
            existing pnpm lint, pnpm typecheck, pnpm build, and pnpm test commands when
            appropriate. Update project state/handoff only if the implementation changes
            project state. Keep changes limited to the active sprint.

            Never invent APIs, models, financial data, customer evidence, test results,
            product requirements, or legal conclusions. Never commit personal financial
            data or secrets. Do not change repository visibility, LICENSE.md, package
            licensing metadata, workflow/security settings, or the product boundary.
            Do not submit applications, contact customers, or create external accounts.
            Treat license inventory findings as evidence only, never as legal clearance.
            Do not add hosted persistence, report-to-file commands, or other future-sprint
            features without a documented decision.

            If the safe next step requires a major product/legal/financial decision, do not
            guess; instead make no code change and clearly report the specific decision
            needed. Do not fabricate a completed task. The workflow will create a PR only
            if you pushed a branch with actual changes.

      - name: Open pull request, require green checks, and merge
        if: steps.agent.outputs.branch_name != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PFO_AUTOMATION_TOKEN }}
          BRANCH_NAME: ${{ steps.agent.outputs.branch_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code origin "refs/heads/$BRANCH_NAME" >/dev/null; then
            echo "::error::The agent reported branch '$BRANCH_NAME', but it is not present on origin."
            exit 1
          fi

          AHEAD_BY="$(gh api "repos/$GH_REPO/compare/main...$BRANCH_NAME" --jq '.ahead_by')"
          if [[ "$AHEAD_BY" == "0" ]]; then
            echo "No commits differ from main; nothing to propose."
            exit 0
          fi

          PR_URL="$(gh pr list --repo "$GH_REPO" --head "$BRANCH_NAME" --base main --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$PR_URL" ]]; then
            PR_URL="$(gh pr create \
              --repo "$GH_REPO" \
              --head "$BRANCH_NAME" \
              --base main \
              --title "feat: autonomous sprint increment" \
              --body "## Summary
          Autonomous PFO OS sprint increment generated by the scheduled engineering workflow.

          ## Validation
          This PR will only be merged by the workflow after both repository CI and full-history secret scanning succeed.

          ## Safety
          Changes must stay within the active sprint. No repository visibility, licensing, financial-data, or product-boundary decisions are authorized by this automation.")"
          fi

          echo "Pull request: $PR_URL"
          gh pr checks "$PR_URL" --repo "$GH_REPO" --watch --fail-fast

          CHECKS="$(gh pr checks "$PR_URL" --repo "$GH_REPO" --json name,state)"
          echo "$CHECKS" | jq .

          echo "$CHECKS" | jq -e '
            any(.[]; .name == "Build, typecheck, lint, and test" and .state == "SUCCESS")
            and
            any(.[]; .name == "Scan current changes and Git history" and .state == "SUCCESS")
          ' >/dev/null || {
            echo "::error::Required CI and full-history secret-scan checks were not both successful. Leaving the PR open."
            exit 1
          }

          gh pr merge "$PR_URL" --repo "$GH_REPO" --squash --delete-branch
