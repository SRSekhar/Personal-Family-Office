name: PFO Actions Smoke Test

on:
  push:
    branches:
      - diagnostic/pfo-actions-smoke
    paths:
      - .github/workflows/pfo-actions-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify runner and lint agent workflow
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm runner starts
        run: echo "GitHub Actions runner started successfully."

      - name: Lint GitHub Actions workflow definitions
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@latest .github/workflows/parallel-agents.yml .github/workflows/autonomous-development.yml
