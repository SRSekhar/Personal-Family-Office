name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, typecheck, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize repository structure
        shell: pwsh
        run: pwsh ./scripts/build/Initialize-PFO.ps1

      - name: Validate repository structure
        shell: pwsh
        run: pwsh ./scripts/build/Initialize-PFO.ps1 -Validate

      - name: Run repository doctor
        shell: pwsh
        run: pwsh ./scripts/build/Initialize-PFO.ps1 -Doctor

      - name: Test bootstrap safety and WhatIf behavior
        shell: pwsh
        run: pwsh ./scripts/tests/Test-BootstrapSafety.ps1

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test
