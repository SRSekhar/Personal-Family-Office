name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, typecheck, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate dependency license inventory
        run: node scripts/security/Generate-LicenseInventory.mjs --output docs/security/DEPENDENCY_LICENSE_INVENTORY.md

      - name: Upload dependency license inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-license-inventory
          path: docs/security/DEPENDENCY_LICENSE_INVENTORY.md
          if-no-files-found: error
          retention-days: 7

      - name: Inspect packed dependency license artifacts
        run: node scripts/security/Inspect-PackedLicenseArtifacts.mjs --output docs/security/PACKED_DEPENDENCY_LICENSE_ARTIFACT_EVIDENCE.md

      - name: Upload packed dependency license evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-dependency-license-evidence
          path: docs/security/PACKED_DEPENDENCY_LICENSE_ARTIFACT_EVIDENCE.md
          if-no-files-found: error
          retention-days: 30

      - name: Audit dependency vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Initialize repository structure
        shell: pwsh
        run: pwsh ./scripts/build/Initialize-PFO.ps1

      - name: Validate repository structure
        shell: pwsh
        run: pwsh ./scripts/build/Initialize-PFO.ps1 -Validate

      - name: Run repository doctor
        shell: pwsh
        run: pwsh ./scripts/build/Initialize-PFO.ps1 -Doctor

      - name: Test bootstrap safety and WhatIf behavior
        shell: pwsh
        run: pwsh ./scripts/tests/Test-BootstrapSafety.ps1

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Prepare browser calculator modules
        run: node scripts/dashboard/prepare-calculators.mjs

      - name: Run tests
        run: pnpm test

      - name: Install isolated Playwright browser-test dependency
        run: npm install --prefix /tmp/pfo-playwright --no-save --package-lock=false playwright

      - name: Install Chromium for browser smoke tests
        run: PLAYWRIGHT_BROWSERS_PATH=/tmp/pfo-playwright-browsers /tmp/pfo-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify FIRE planner in a real browser
        run: NODE_PATH=/tmp/pfo-playwright/node_modules PLAYWRIGHT_BROWSERS_PATH=/tmp/pfo-playwright-browsers node scripts/dashboard/fire-planner-browser-smoke.mjs
